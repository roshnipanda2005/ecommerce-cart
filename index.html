<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Cart | JS Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛒 Flipkart Style Cart
        <span id = "cart-badge">0</span>
    </h1>
    <p>Simple E-Commerce Cart using JavaScript</p>
    <input type ="text" id="search" placeholder="Search products...">
</header>
 
<main class="container">

    <!-- Products Section -->
    <section class="products">
        <h2>Products</h2>

        <div id="products"></div>
    </section>

    <!-- Cart Section -->
    <section class="cart">
        <h2>Cart</h2>
        <div id="cart-items"></div>
        <h3>Total: ₹<span id="total-price">0</span></h3>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
